name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the android/ and web/ folders (only adds missing files;
      # lib/, test/ and pubspec.yaml are kept as they are).
      - name: Create platform folders
        run: flutter create --platforms=android,web --org lr.roomfinder --project-name roomfinder .

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Settings come from repository secrets (Settings > Secrets and variables > Actions).
      - name: Write build settings
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_APP_ID_WEB: ${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          WEB_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python3 - <<'EOF'
          import json, os
          keys = ["FIREBASE_API_KEY", "FIREBASE_APP_ID_ANDROID", "FIREBASE_APP_ID_WEB",
                  "FIREBASE_SENDER_ID", "FIREBASE_PROJECT_ID", "FIREBASE_AUTH_DOMAIN",
                  "CLOUDINARY_CLOUD", "CLOUDINARY_PRESET", "WEB_BASE_URL"]
          json.dump({k: os.environ.get(k, "") for k in keys}, open("build_env.json", "w"))
          missing = [k for k in keys if not os.environ.get(k) and k != "FIREBASE_AUTH_DOMAIN"]
          if missing:
              print("::warning::Missing secrets: " + ", ".join(missing))
          EOF

      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=build_env.json

      - name: Build website
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define-from-file=build_env.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roomfinder-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
